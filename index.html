h1{text-align:center;color:#222;margin-bottom:30px;font-size:24px;}
.stack-box{background:#fff;border-radius:14px;padding:16px;margin-bottom:20px;box-shadow:0 2px 8px #00000012;}
.stack-box h3{font-size:18px;color:#333;margin-bottom:12px;}
.img-wrap{position:relative;height:320px;overflow:hidden;border-radius:10px;margin-bottom:12px;}
.img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:opacity 0.35s ease;}
.img-wrap .img-top{opacity:0;}
.img-wrap.active .img-top{opacity:1;}
.expand-btn{width:100%;padding:10px;border:none;background:#3478f6;color:white;border-radius:8px;font-size:16px;cursor:pointer;}
</style>

<script>
const btns = document.querySelectorAll('.expand-btn');
btns.forEach(btn=>{
  btn.onclick = function(){
    const wrap = this.previousElementSibling;
    wrap.classList.toggle('active');
    if(wrap.classList.contains('active')){
      this.textContent = "收起";
    }else{
      this.textContent = "展开2";
    }
  }
})
</script>
