<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Mint Water Photography</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#f5f7f6;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",PingFang SC,Helvetica,Arial,sans-serif}
body{padding:40px 14px}
body.lock-scroll{overflow:hidden}

.page-header{text-align:center;margin-bottom:28px}
.page-title{font-size:30px;font-weight:800;letter-spacing:-0.02em;color:#34c7a1}
.page-sub{font-size:14px;color:#666;margin-top:6px}

.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:820px;margin:0 auto}

.apple-card{background:#fff;border-radius:20px;padding:14px 12px 12px;cursor:pointer}
.apple-card.hidden{opacity:0;visibility:hidden;pointer-events:none}

.group-title{font-size:13px;font-weight:700;text-align:center;margin-bottom:10px;color:#333}

.img-wrap{position:relative;width:100%;aspect-ratio:390/569;margin-bottom:8px;overflow:hidden}
.img-wrap img{width:100%;height:100%;border-radius:14px;object-fit:cover;cursor:pointer;-webkit-transform:translateZ(0);transform:translateZ(0)}

.img-wrap.normal .img-1{position:absolute;top:0;left:0;z-index:2;transform:rotate(-2deg)}
.img-wrap.normal .img-2{position:absolute;top:0;left:0;z-index:1;transform:rotate(2deg)}
.img-wrap.normal.open{aspect-ratio:auto}
.img-wrap.normal.open img{position:static;transform:rotate(0);margin-bottom:10px;height:auto}
.img-wrap.normal.open img:last-child{margin-bottom:0}

.img-wrap.four-stack img{position:absolute;top:0;left:0;-webkit-transform:translateZ(0);transform:translateZ(0)}
.img-wrap.four-stack .img-s1{z-index:4;transform:rotate(-2.4deg)}
.img-wrap.four-stack .img-s2{z-index:3;transform:rotate(-0.8deg)}
.img-wrap.four-stack .img-s3{z-index:2;transform:rotate(0.8deg)}
.img-wrap.four-stack .img-s4{z-index:1;transform:rotate(2.4deg)}
.img-wrap.four-stack.open{aspect-ratio:auto;overflow:visible}
.img-wrap.four-stack.open img{position:static;transform:rotate(0);margin-bottom:10px;height:auto}
.img-wrap.four-stack.open img:last-child{margin-bottom:0}

.toggle-btn{position:absolute;right:-6px;top:10px;z-index:999;padding:5px 10px;border:none;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;cursor:pointer}

.card-overlay{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.45);z-index:90;padding:16px}
.card-overlay.active{display:flex}
.overlay-card{width:min(520px,94vw);max-height:86vh;overflow-y:hidden;background:#fff;border-radius:22px;padding:22px 18px 20px;margin-top:4vh}
.overlay-card.open-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay-card .group-title{font-size:15px;margin-bottom:16px}

.lightbox{position:fixed;inset:0;background:#000;z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}
.lightbox.active{display:flex}
.lightbox-img{max-width:92%;max-height:92%;border-radius:14px;-webkit-transform:translateZ(0);transform:translateZ(0);cursor:grab}
.lightbox-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:none;font-size:16px;cursor:pointer}

@media (max-width:480px){
  body{padding:28px 10px}
  .gallery{gap:12px}
  .apple-card{padding:12px 10px 10px}
  .toggle-btn{right:-4px;top:8px}
}
@media (max-width:360px){
  .gallery{grid-template-columns:1fr}
}
</style>

<div class="lightbox" id="lightbox">

  <img class="lightbox-img" id="lightboxImg">
</div>

<script>
const overlay = document.getElementById("cardOverlay");
const overlayContent = document.getElementById("overlayContent");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

let scale = 1;
let posX = 0;
let posY = 0;
let isDrag = false;
let startX = 0;
let startY = 0;
let touchDist = 0;

function openCard(cardEl){
  overlayContent.innerHTML = "";

  const wrap = document.createElement("div");
  wrap.className = "overlay-card";
  wrap.innerHTML = cardEl.innerHTML;
  overlayContent.appendChild(wrap);

  overlay.classList.add("active");
  document.body.classList.add("lock-scroll");

  document.querySelectorAll(".apple-card").forEach(card=>{
    card.classList.add("hidden");
  });

  const toggleBtn = wrap.querySelector(".toggle-btn");
  const imgWrap = toggleBtn.parentElement;

  toggleBtn.onclick = function(e){
    e.stopPropagation();
    imgWrap.classList.toggle("open");

    if(imgWrap.classList.contains("open")){
      wrap.classList.add("open-scroll");
      toggleBtn.innerText = "收起";
    }else{
      wrap.classList.remove("open-scroll");
      toggleBtn.innerText = imgWrap.classList.contains("four-stack") ? "展开4" : "展开2";
    }
  };

  wrap.querySelectorAll(".img-wrap img").forEach(img=>{
    img.onclick = function(e){
      e.stopPropagation();
      openLightbox(img.src);
    };
  });
}

function closeCard(){
  overlay.classList.remove("active");
  overlayContent.innerHTML = "";
  document.body.classList.remove("lock-scroll");

  document.querySelectorAll(".apple-card").forEach(card=>{
    card.classList.remove("hidden");
  });
}

document.querySelectorAll(".gallery .toggle-btn").forEach(btn=>{
  btn.onclick = function(e){
    e.stopPropagation();
    const wrap = btn.parentElement;
    wrap.classList.toggle("open");
    btn.innerText = wrap.classList.contains("open")
      ? "收起"
      : wrap.classList.contains("four-stack")
        ? "展开4"
        : "展开2";
  };
});

function openLightbox(src){
  scale = 1;
  posX = 0;
  posY = 0;
  lightboxImg.style.transform = "translate(0,0) scale(1)";
  lightboxImg.src = src;
  lightbox.classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeLightbox(){
  lightbox.classList.remove("active");
  lightboxImg.src = "";
  document.body.style.overflow = "";
}

lightboxImg.addEventListener("wheel",function(e){
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.12 : -0.12;
  scale = Math.max(0.4, Math.min(scale + delta, 4));
  lightboxImg.style.transform = "translate(" + posX + "px," + posY + "px) scale(" + scale + ")";
});

lightboxImg.addEventListener("mousedown",function(e){
  isDrag = true;
  startX = e.clientX - posX;
  startY = e.clientY - posY;
});

document.addEventListener("mousemove",function(e){
  if(!isDrag) return;
  posX = e.clientX - startX;
  posY = e.clientY - startY;
  lightboxImg.style.transform = "translate(" + posX + "px," + posY + "px) scale(" + scale + ")";
});

document.addEventListener("mouseup",function(){
  isDrag = false;
});

lightboxImg.addEventListener("touchstart",function(e){
  if(e.touches.length === 2){
    touchDist = Math.hypot(
      e.touches[0].pageX - e.touches[1].pageX,
      e.touches[0].pageY - e.touches[1].pageY
    );
  }
});

lightboxImg.addEventListener("touchmove",function(e){
  if(e.touches.length === 2){
    e.preventDefault();

    const dist = Math.hypot(
      e.touches[0].pageX - e.touches[1].pageX,
      e.touches[0].pageY - e.touches[1].pageY
    );

    scale = Math.max(0.4, Math.min(scale * (dist / touchDist), 4));
    touchDist = dist;
    lightboxImg.style.transform = "translate(" + posX + "px," + posY + "px) scale(" + scale + ")";

  }else if(e.touches.length === 1 && !isDrag){
    isDrag = true;
    startX = e.touches[0].pageX - posX;
    startY = e.touches[0].pageY - posY;
  }
});

lightboxImg.addEventListener("touchend",function(){
  isDrag = false;
});

document.addEventListener("keydown",function(e){
  if(e.key === "Escape"){
    closeLightbox();
    closeCard();
  }
});

lightbox.addEventListener("click",function(e){
  if(e.target === lightbox) closeLightbox();
});
</script>
