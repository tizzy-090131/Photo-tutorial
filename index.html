<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mint Water Photography</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  :root {
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --card: rgba(255, 255, 255, 0.72);
    --border: rgba(0, 0, 0, 0.06);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 30px rgba(0, 0, 0, 0.12);
  }

  body {
    /* 修正背景文件名 pattern-bg.png */
    background-image: url("pattern-bg.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    min-height: 100vh;
    padding: 56px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
      "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    color: var(--text);
  }

  .page-header {
    text-align: center;
    margin-bottom: 64px;
  }

  .page-title {
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #ffffff;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.16);
    margin-bottom: 14px;
  }

  .page-subtitle {
    font-size: 17px;
    color: rgba(255, 255, 255, 0.82);
  }

  /* 19组网格 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 80px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* 苹果风卡片 */
  .apple-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding: 24px 18px 22px;
    text-align: center;
  }

  .group-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-bottom: 18px;
  }

  /* 叠图容器 */
  .img-stack {
    position: relative;
    width: 220px;
    height: 280px;
    margin: 0 auto;
  }

  .img-stack img {
    position: absolute;
    top: 0;
    left: 0;
    width: 180px;
    height: 240px;
    object-fit: cover;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.14);
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.4s ease;
    border: 1px solid rgba(255, 255, 255, 0.4);
  }

  /* 两张图叠放 */
  .img-stack img:nth-child(1) {
    transform: rotate(-2.5deg);
    z-index: 1;
  }

  .img-stack img:nth-child(2) {
    transform: rotate(2deg);
    z-index: 2;
  }

  /* 悬停散开 */
  .img-stack:hover img:nth-child(1) {
    transform: rotate(-4deg) translateX(-18px);
  }

  .img-stack:hover img:nth-child(2) {
    transform: rotate(3deg) translateX(18px);
  }

  .img-stack img:hover {
    box-shadow: 0 22px 44px rgba(0, 0, 0, 0.2);
  }

  /* 大图预览 */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(22, 22, 23, 0.86);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .lightbox.active {
    display: flex;
  }

  .lightbox img {
    max-width: 92%;
    max-height: 88vh;
    border-radius: 16px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    color: #f5f5f7;
    border: none;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
  }

  .lightbox-close:hover {
    background: rgba(255, 255, 255, 0.24);
  }

  /* 移动端适配 */
  @media (max-width: 480px) {
    body {
      padding: 36px 14px;
    }

    .gallery {
      gap: 60px 14px;
      grid-template-columns: repeat(2, 1fr);
    }

    .apple-card {
      padding: 18px 12px 18px;
      border-radius: 20px;
    }

    .img-stack {
      width: 150px;
      height: 200px;
    }

    .img-stack img {
      width: 130px;
      height: 180px;
    }
  }
</style>
</head>

    <img id="lightImg" src="" alt="大图预览" />

<script>
  const lightbox = document.getElementById("lightbox");
  const lightImg = document.getElementById("lightImg");

  function openLightbox(src) {
    lightImg.src = src;
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });
</script>
