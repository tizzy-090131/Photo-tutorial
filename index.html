<meta charset="UTF-8">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
}

body{
  background-image: url("pattern-bg.png");
  background-repeat: repeat;
  background-size: 300px;
  background-color:#fff;
  color:#1d1d1f;
  position:relative;
  overflow-x:hidden;
  padding-bottom:80px;
}

/* 标题 */
.page-header{
  padding:28px 22px 18px;
  position:relative;
  z-index:1;
}
.page-title{
  font-size:20px;
  font-weight:500;
  letter-spacing:0.3px;
}

/* 容器 */
.groups{
  max-width:640px;
  margin:0 auto;
  padding:0 20px;
  position:relative;
  z-index:1;
}

.photo-group{
  margin-bottom:56px;
}

.group-name{
  font-size:16px;
  font-weight:500;
  color:#424245;
  margin:0 0 14px 4px;
}

.stack-box{
  position:relative;
  height:260px;
}

/* 叠图卡片 */
.stack-slot{
  position:absolute;
  width:86%;
  left:50%;
  transform:translateX(-50%);
  border-radius:20px;
  box-shadow:0 10px 28px rgba(0,0,0,0.14);
  height:220px;
  background:#e8e8ed;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  transition:top 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.g1-s1{top:0;   z-index:2;}
.g1-s2{top:16px;z-index:1;}

.g2-s1{top:0;   z-index:2;}
.g2-s2{top:16px;z-index:1;}

.g3-s1{top:0;   z-index:2;}
.g3-s2{top:16px;z-index:1;}

.g4-s1{top:0;   z-index:2;}
.g4-s2{top:16px;z-index:1;}

.g5-s1{top:0;   z-index:2;}
.g5-s2{top:16px;z-index:1;}

.g6-s1{top:0;   z-index:2;}
.g6-s2{top:16px;z-index:1;}

.g7-s1{top:0;   z-index:2;}
.g7-s2{top:16px;z-index:1;}

.g8-s1{top:0;   z-index:2;}
.g8-s2{top:16px;z-index:1;}

.g9-s1{top:0;   z-index:2;}
.g9-s2{top:16px;z-index:1;}

.g10-s1{top:0;   z-index:2;}
.g10-s2{top:16px;z-index:1;}

/* 展开按钮 */
.expand-btn{
  position:absolute;
  bottom:-34px;
  left:50%;
  transform:translateX(-50%);
  background:#2c2c2e;
  color:#fff;
  padding:8px 16px;
  border-radius:99px;
  font-size:14px;
  cursor:pointer;
  border:none;
  z-index:10;
}

/* 全屏预览 */
.preview{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.93);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:20px;
}
.preview img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:14px;
}
.preview.active{
  display:flex;
}

/* 收起状态 */
.stack-box.collapsed .g1-s1{top:0;}
.stack-box.collapsed .g1-s2{top:16px;}

.stack-box.collapsed .g2-s1{top:0;}
.stack-box.collapsed .g2-s2{top:16px;}

<!-- 全屏预览 -->
<div class="preview" onclick="closePreview()">
  <img id="preview-img">
</div>

<script>
const preview = document.querySelector('.preview');
const previewImg = document.getElementById('preview-img');

function toggleStack(btn, groupId){
  const box = document.querySelector(`.stack-box[data-group="${groupId}"]`);
  const slots = box.querySelectorAll('.stack-slot');
  const isCollapsed = box.classList.contains('collapsed');

  if(isCollapsed){
    slots.forEach((el, i)=>{
      el.style.top = i * 110 + "px";
    });
    btn.innerText = "收起";
    box.classList.remove('collapsed');
  }else{
    slots.forEach((el, i)=>{
      el.style.top = ["0", "16px"][i];
    });
    btn.innerText = "展开 2";
    box.classList.add('collapsed');
  }
}

function openPreview(src){
  if(!src) return;
  previewImg.src = src;
  preview.classList.add('active');
  document.body.style.overflow = "hidden";
}

function closePreview(){
  preview.classList.remove('active');
  previewImg.src = "";
  document.body.style.overflow = "";
}
</script>
