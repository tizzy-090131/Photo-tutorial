<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:url("pattern-bg.png") center/420px auto repeat;min-height:100vh;padding:56px 20px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",PingFang SC,Helvetica,Arial,sans-serif;color:#1d1d1f}
.page-header{text-align:center;margin-bottom:48px}
.page-title{font-size:clamp(28px,5vw,48px);font-weight:700;letter-spacing:-0.02em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.3)}
.page-sub{font-size:17px;color:rgba(255,255,255,0.85);margin-top:8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:60px 24px;max-width:1100px;margin:0 auto}
.apple-card{background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.06);border-radius:24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 30px rgba(0,0,0,.12);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:24px 20px 22px}
.group-title{font-size:16px;font-weight:600;text-align:center;margin-bottom:18px}
.img-wrap{position:relative;min-height:240px;margin-bottom:16px}
.img-wrap img{width:100%;border-radius:16px;object-fit:cover;cursor:pointer;transition:.4s cubic-bezier(.22,1,.36,1);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.img-wrap .img-1{position:absolute;top:0;left:0;z-index:2;transform:rotate(-2deg)}
.img-wrap .img-2{position:absolute;top:0;left:0;z-index:1;transform:rotate(2deg)}
.img-wrap.open .img-1,.img-wrap.open .img-2{position:static;transform:rotate(0)}
.img-wrap.open .img-1{margin-bottom:14px}
/* 微信悬浮小按钮，浮在图片右下角 */
.toggle-btn{position:absolute;right:12px;bottom:12px;padding:6px 12px;border:none;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;cursor:pointer;transition:.2s}
.toggle-btn:hover{background:rgba(0,0,0,.7)}
/* 缩放弹窗 */
.lightbox{position:fixed;inset:0;background:rgba(22,22,23,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.lightbox.active{display:flex}
.lightbox-img{max-width:90%;max-height:90%;border-radius:16px;transform-origin:center;cursor:grab}
.lightbox-img:active{cursor:grabbing}
.lightbox-close{position:absolute;top:20px;right:20px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);color:#f5f5f7;border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.lightbox-close:hover{background:rgba(255,255,255,.24)}
@media (max-width:480px){body{padding:36px 14px}.gallery{grid-template-columns:1fr;gap:48px}.apple-card{padding:18px 16px 18px;border-radius:20px}}
</style>
</head>

<div class="lightbox" id="lightbox">
<button class="lightbox-close" onclick="closeLightbox()">✕</button>
<img class="lightbox-img" id="lightboxImg">

<script>
document.querySelectorAll('.toggle-btn').forEach(btn=>{
btn.onclick=function(e){
e.stopPropagation();
const wrap=this.parentElement;
wrap.classList.toggle('open');
this.innerText=wrap.classList.contains('open')?'收起':'展开2';
}
})
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightboxImg');
let scale=1,posX=0,posY=0,isDrag=false,startX,startY;
function openLightbox(src){
scale=1;posX=0;posY=0;
lightboxImg.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;
lightboxImg.src=src;
lightbox.classList.add('active');
document.body.style.overflow='hidden';
}
function closeLightbox(){
lightbox.classList.remove('active');
document.body.style.overflow='';
}
lightboxImg.addEventListener('wheel',e=>{
e.preventDefault();
const delta=e.deltaY<0 ? 0.12 : -0.12;
scale=Math.max(0.4,Math.min(scale+delta,4));
lightboxImg.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;
})
lightboxImg.addEventListener('mousedown',e=>{isDrag=true;startX=e.clientX-posX;startY=e.clientY-posY})
document.addEventListener('mousemove',e=>{
if(!isDrag) return;
posX=e.clientX-startX;posY=e.clientY-startY;
lightboxImg.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;
})
document.addEventListener('mouseup',()=>isDrag=false)
let touchDist=0;
lightboxImg.addEventListener('touchstart',e=>{
if(e.touches.length===2){touchDist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY)}
})
lightboxImg.addEventListener('touchmove',e=>{
if(e.touches.length===2){
e.preventDefault();
const dist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);
scale=Math.max(0.4,Math.min(scale*(dist/touchDist),4));
touchDist=dist;
lightboxImg.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;
}else if(e.touches.length===1&&!isDrag){
isDrag=true;startX=e.touches[0].pageX-posX;startY=e.touches[0].pageY-posY;
}
})
lightboxImg.addEventListener('touchend',()=>isDrag=false)
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()})
lightbox.onclick=e=>{if(e.target===lightbox)closeLightbox()}
</script>
