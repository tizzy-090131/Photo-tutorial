<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Water Photography</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", PingFang SC, Helvetica, sans-serif;
            background-image: url("https://cdn.jsdelivr.net/gh/tizzy-090131/Photo-tutorial/pattern-bg.png");
            background-size: 420px;
            background-repeat: repeat;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255,255,255,0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            width: 100%;
            max-width: 460px;
            border-radius: 40px;
            border:1px solid rgba(0,0,0,.06);
            padding: 60px 36px;
            box-shadow: 0 1px 2px rgba(0,0,0,.04),0 12px 30px rgba(0,0,0,.12);
        }
        .title-area {
            margin-bottom: 64px;
            text-align: left;
        }
        .title-area h1 {
            font-size: 34px;
            margin: 0 0 12px;
            color: #1d1d1f;
            letter-spacing:-0.02em;
        }
        .title-area p {
            font-size: 18px;
            color: #424245;
            margin: 0;
            line-height:1.5;
        }
        .btn-group {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap:wrap;
        }
        .capsule-btn {
            background: #000000;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 14px 34px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.24s ease;
        }
        .capsule-btn:hover {
            opacity:0.82;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title-area">
            <h1>Mint Water Photography</h1>
            <p>待填写描述文字，以后随时修改</p>
        </div>
        <div class="btn-group">
            <!-- 跳转链接：指向你的相册页面 gallery.html -->
            <a href="https://tizzy-090131.github.io/Photo-tutorial/gallery.html" class="capsule-btn">摄影技巧</a>
            <a href="#" class="capsule-btn">拍照姿势</a>
        </div>
    </div>
</body>
</html>
