<title>Mint Water Photography</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-font-smoothing: antialiased;
}
body{
  /* 背景 pattern-BG.png */
  background-image: url("pattern-BG.png");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  min-height: 100vh;
  padding:40px 20px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", PingFang SC, sans-serif;
}
.wrapper{
  max-width:820px;
  margin:0 auto;
}
h1{
  text-align:center;
  color:#fff;
  margin-bottom:42px;
  font-size:38px;
  font-weight:600;
  letter-spacing:-0.02em;
  text-shadow: 0 2px 10px rgba(0,0,0,0.15);
}
/* 苹果风卡片 */
.stack-box{
  background:rgba(255,255,255,0.72);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-radius:22px;
  padding:24px;
  margin-bottom:26px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
  border:1px solid rgba(255,255,255,0.4);
}
.stack-box h3{
  font-size:20px;
  color:#1d1d1f;
  margin-bottom:14px;
  font-weight:600;
}
.img-wrap{
  position:relative;
  height:340px;
  overflow:hidden;
  border-radius:18px;
  margin-bottom:16px;
}
.img-wrap img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:opacity 0.4s cubic-bezier(0.2,0,0.2,1);
  cursor:pointer;
}
.img-wrap .img-bottom{
  opacity:1;
}
.img-wrap .img-top{
  opacity:0;
}
.img-wrap.active .img-bottom{
  opacity:0;
}
.img-wrap.active .img-top{
  opacity:1;
}
.expand-btn{
  width:100%;
  padding:12px;
  border:none;
  background:#007aff;
  color:#ffffff;
  border-radius:12px;
  font-size:17px;
  cursor:pointer;
  transition:background 0.25s ease;
}
.expand-btn:hover{
  background:#0066dd;
}
/* ========== 苹果风大图弹窗 Lightbox ========== */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.lightbox.active{
  display:flex;
}
.lightbox img{
  max-width:92%;
  max-height:90vh;
  border-radius:18px;
  box-shadow:0 30px 70px rgba(0,0,0,0.35);
}
</style>
</head>

<!-- 大图预览弹窗 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightImg" src="">
</div>

<script>
// 展开收起按钮逻辑
const btns = document.querySelectorAll('.expand-btn');
btns.forEach(btn=>{
  btn.onclick = function(){
    const wrap = this.previousElementSibling;
    wrap.classList.toggle('active');
    if(wrap.classList.contains('active')){
      this.textContent = "收起";
    }else{
      this.textContent = "展开2";
    }
  }
})

// 图片放大预览
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lightImg');
function openLightbox(src){
  lbImg.src = src;
  lb.classList.add('active');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  lb.classList.remove('active');
  document.body.style.overflow='';
}
// ESC按键关闭大图
document.addEventListener('keydown',e=>{
  if(e.key === 'Escape') closeLightbox();
})
</script>
