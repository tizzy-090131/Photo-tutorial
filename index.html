<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mint Water Photography</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;}
body{background:#f5f5f7;color:#1d1d1f;}
/* 顶满屏幕的英文标题 */
.header-bar{width:100%;padding:20px 0;text-align:center;background:#ffcc00;}
.header-title{font-size:32px;font-weight:600;letter-spacing:0.5px;}
/* 微信风叠图容器 */
.stack-area{max-width:600px;margin:30px auto;padding:0 20px;}
.stack-box{position:relative;height:320px;}
/* 占位图框，之后换你自己的图 */
.stack-slot{position:absolute;width:85%;left:50%;transform:translateX(-50%);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,0.12);height:280px;background:#e8e8ed;cursor:pointer;transition:all 0.3s ease;}
.s1{top:0;z-index:3;}
.s2{top:16px;z-index:2;}
.s3{top:32px;z-index:1;}
/* 展开按钮 */
.expand-btn{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:6px 12px;border-radius:12px;font-size:14px;cursor:pointer;}
/* 全屏预览 */
.preview{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;}
.preview img{max-width:100%;max-height:90vh;border-radius:12px;}
.preview.active{display:flex;}
</style>
</head>
<body>
<div class="header-bar">
  <div class="header-title">Mint Water Photography</div>
</div>

<div class="stack-area">
  <div class="stack-box">
    <div class="stack-slot s1" onclick="openPreview('')"></div>
    <div class="stack-slot s2" onclick="openPreview('')"></div>
    <div class="stack-slot s3" onclick="openPreview('')"></div>
    <div class="expand-btn" onclick="toggleStack(this)">展开 3</div>
  </div>
</div>

<div class="preview" onclick="closePreview()">
  <img id="preview-img">
</div>

<script>
const preview = document.querySelector('.preview');
const previewImg = document.getElementById('preview-img');
let isExpanded = false;

function openPreview(src){
  if(!src)return;
  previewImg.src = src;
  preview.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closePreview(){
  preview.classList.remove('active');
  document.body.style.overflow = '';
}
function toggleStack(btn){
  const slots = document.querySelectorAll('.stack-slot');
  if(!isExpanded){
    slots.forEach((el,i)=>{el.style.top = i*20 + 'px';});
    btn.innerText = '收起';
  }else{
    slots[0].style.top = '0';
    slots[1].style.top = '16px';
    slots[2].style.top = '32px';
    btn.innerText = '展开 3';
  }
  isExpanded = !isExpanded;
}
</script>
</body>
</html>
