<html lang="zh-CN">

<meta charset="UTF-8">

<title>Mint Water Photography</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{--text:#1d1d1f;--card:rgba(255,255,255,.72);--border:rgba(0,0,0,.06);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 30px rgba(0,0,0,.12)}
body{background:url("pattern-bg.png") center/cover fixed no-repeat;min-height:100vh;padding:56px 20px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",PingFang SC,Arial;color:var(--text)}
.page-header{text-align:center;margin-bottom:64px}
.page-title{font-size:clamp(32px,4vw,48px);font-weight:700;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.16);margin-bottom:14px}
.page-subtitle{font-size:17px;color:rgba(255,255,255,.82)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px 24px;max-width:1100px;margin:0 auto}
.apple-card{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:24px 20px 22px}
.group-title{font-size:16px;font-weight:600;text-align:center;margin-bottom:18px}
.img-wrap{position:relative;min-height:240px;margin-bottom:16px}
.img-wrap img{width:100%;border-radius:16px;object-fit:cover;cursor:pointer;transition:.4s cubic-bezier(.22,1,.36,1);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.img-wrap .img-1{position:absolute;top:0;left:0;z-index:2;transform:rotate(-2deg)}
.img-wrap .img-2{position:absolute;top:0;left:0;z-index:1;transform:rotate(2deg)}
.img-wrap.open .img-1,.img-wrap.open .img-2{position:static;transform:rotate(0)}
.img-wrap.open .img-1{margin-bottom:14px}
.toggle-btn{width:100%;padding:11px;border:none;border-radius:14px;background:#007aff;color:#fff;font-size:16px;cursor:pointer;transition:.25s}
.toggle-btn:hover{background:#0066dd}
.lightbox{position:fixed;inset:0;background:rgba(22,22,23,.86);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);z-index:9999;display:none;align-items:center;justify-content:center;padding:24px}
.lightbox.active{display:flex}
.lightbox img{max-width:92%;max-height:88vh;border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.lightbox-close{position:absolute;top:20px;right:20px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);color:#f5f5f7;border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.lightbox-close:hover{background:rgba(255,255,255,.24)}
@media (max-width:480px){body{padding:36px 14px}.gallery{grid-template-columns:1fr;gap:30px}.apple-card{padding:18px 16px 18px;border-radius:20px}}
</style>
</head>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<button class="lightbox-close" onclick="closeLightbox()">✕</button>
<img id="lightboxImg">
</div>
<script>
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightboxImg');
//图片弹窗
function openLightbox(src){lightboxImg.src=src;lightbox.classList.add('active');document.body.style.overflow='hidden'}
function closeLightbox(){lightbox.classList.remove('active');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()})
//展开收起按钮
document.querySelectorAll('.toggle-btn').forEach(btn=>{
btn.onclick=function(){
const wrap=this.previousElementSibling;
wrap.classList.toggle('open');
this.innerText=wrap.classList.contains('open')?'收起':'展开2';
}
})
</script>
