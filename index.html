<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mint Water Photography</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
}

body{
  background-image: url("pattern-bg.png");
  background-repeat: repeat;
  background-size: 300px;
  background-color:#fff;
  color:#1d1d1f;
  position:relative;
  overflow-x:hidden;
  padding-bottom:60px;
}

/* 小猫贴纸样式 */
.cat-sticker{
  position:absolute;
  opacity:0.6;
  pointer-events:none;
  z-index:0;
  background-image:url('cat-stickers.png');
  background-size: 300px;
  background-repeat:no-repeat;
}
/* 单独裁剪每一只小猫 */
.sticker-1{top:100px; left:20px;width:80px;height:80px; background-position: 10% 10%;transform:rotate(-5deg);}
.sticker-2{top:350px; right:20px;width:80px;height:80px; background-position: 80% 10%;transform:rotate(4deg);}
.sticker-3{top:650px; left:15px;width:80px;height:80px; background-position: 10% 35%;transform:rotate(-3deg);}
.sticker-4{top:920px; right:15px;width:80px;height:80px; background-position: 80% 55%;transform:rotate(6deg);}
.sticker-5{top:1200px; left:20px;width:80px;height:80px; background-position: 10% 80%;transform:rotate(-4deg);}
.sticker-6{top:1480px; right:20px;width:80px;height:80px; background-position: 80% 80%;transform:rotate(3deg);}

/* 标题：小字号、靠左 */
.page-header{
  padding:28px 22px 18px;
  position:relative;
  z-index:1;
}
.page-title{
  font-size:20px;
  font-weight:500;
  letter-spacing:0.3px;
}

/* 多组叠图容器 */
.groups{
  max-width:640px;
  margin:0 auto;
  padding:0 20px;
  position:relative;
  z-index:1;
}

.photo-group{
  margin-bottom:56px;
}

.group-name{
  font-size:16px;
  font-weight:500;
  color:#424245;
  margin:0 0 14px 4px;
}

.stack-box{
  position:relative;
  height:260px;
}

/* 每张叠图卡片，每组现在2张 */
.stack-slot{
  position:absolute;
  width:86%;
  left:50%;
  transform:translateX(-50%);
  border-radius:20px;
  box-shadow:0 10px 28px rgba(0,0,0,0.14);
  height:220px;
  background:#e8e8ed;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  transition:top 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.g1-s1{top:0;   z-index:2;}
.g1-s2{top:16px;z-index:1;}

.g2-s1{top:0;   z-index:2;}
.g2-s2{top:16px;z-index:1;}

.g3-s1{top:0;   z-index:2;}
.g3-s2{top:16px;z-index:1;}

.g4-s1{top:0;   z-index:2;}
.g4-s2{top:16px;z-index:1;}

/* 展开按钮 */
.expand-btn{
  position:absolute;
  bottom:-34px;
  left:50%;
  transform:translateX(-50%);
  background:#2c2c2e;
  color:#fff;
  padding:8px 16px;
  border-radius:99px;
  font-size:14px;
  cursor:pointer;
  border:none;
  z-index:10;
}

/* 全屏预览 */
.preview{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.93);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:20px;
}
.preview img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:14px;
}
.preview.active{
  display:flex;
}

/* 收起状态：恢复堆叠 */
.stack-box.collapsed .g1-s1{top:0;}
.stack-box.collapsed .g1-s2{top:16px;}

.stack-box.collapsed .g2-s1{top:0;}
.stack-box.collapsed .g2-s2{top:16px;}

.stack-box.collapsed .g3-s1{top:0;}
.stack-box.collapsed .g3-s2{top:16px;}

.stack-box.collapsed .g4-s1{top:0;}
.stack-box.collapsed .g4-s2{top:16px;}
</style>
</head>
<body>
<!-- 6个散落小猫贴纸 -->
<div class="cat-sticker sticker-1"></div>
<div class="cat-sticker sticker-2"></div>
<div class="cat-sticker sticker-3"></div>
<div class="cat-sticker sticker-4"></div>
<div class="cat-sticker sticker-5"></div>
<div class="cat-sticker sticker-6"></div>

<!-- 顶部英文标题 -->
<div class="page-header">
  <div class="page-title">Mint Water Photography</div>
</div>

<div class="groups">

  <!-- 第1组（2张图） -->
  <div class="photo-group">
    <div class="group-name">Collection 01</div>
    <div class="stack-box collapsed" data-group="1">
      <div class="stack-slot g1-s1" data-src="" onclick="openPreview(this.dataset.src)"></div>
      <div class="stack-slot g1-s2" data-src="" onclick="openPreview(this.dataset.src)"></div>
      <button class="expand-btn" onclick="toggleStack(this, 1)">展开 2</button>
    </div>
  </div>

  <!-- 第2组（2张图） -->
  <div class="photo-group">
    <div class="group-name">Collection 02</div>
    <div class="stack-box collapsed" data-group="2">
      <div class="stack-slot g2-s1" data-src="" onclick="openPreview(this.dataset.src)"></div>
      <div class="stack-slot g2-s2" data-src="" onclick="openPreview(this.dataset.src)"></div>
      <button class="expand-btn" onclick="toggleStack(this, 2)">展开 2</button>
    </div>
  </div>

  <!-- 第3组（2张图） -->
  <div class="photo-group">
    <div class="group-name">Collection 03</div>
    <div class="stack-box collapsed" data-group="3">
      <div class="stack-slot g3-s1" data-src="" onclick="openPreview(this.dataset.src)"></div>
      <div class="stack-slot g3-s2" data-src="" onclick="openPreview(this.dataset.src)"></div>
      <button class="expand-btn" onclick="toggleStack(this, 3)">展开 2</button>
    </div>
  </div>

  <!-- 第4组（2张图） -->
  <div class="photo-group">
    <div class="group-name">Collection 04</div>
    <div class="stack-box collapsed" data-group="4">
      <div class="stack-slot g4-s1" data-src="" onclick="openPreview(this.dataset.src)"></div>
      <div class="stack-slot g4-s2" data-src="" onclick="openPreview(this.dataset.src)"></div>
      <button class="expand-btn" onclick="toggleStack(this, 4)">展开 2</button>
    </div>
  </div>

</div>

<!-- 全屏预览 -->
<div class="preview" onclick="closePreview()">
  <img id="preview-img">
</div>

<script>
const preview = document.querySelector('.preview');
const previewImg = document.getElementById('preview-img');

// 每一组独立展开/收起，每组2张图片
function toggleStack(btn, groupId){
  const box = document.querySelector(`.stack-box[data-group="${groupId}"]`);
  const slots = box.querySelectorAll('.stack-slot');
  const isCollapsed = box.classList.contains('collapsed');

  if(isCollapsed){
    slots.forEach((el, i)=>{
      el.style.top = i * 110 + "px";
    });
    btn.innerText = "收起";
    box.classList.remove('collapsed');
  }else{
    slots.forEach((el, i)=>{
      el.style.top = ["0", "16px"][i];
    });
    btn.innerText = "展开 2";
    box.classList.add('collapsed');
  }
}

// 点击任意图片全屏放大
function openPreview(src){
  if(!src) return;
  previewImg.src = src;
  preview.classList.add('active');
  document.body.style.overflow = "hidden";
}

// 关闭大图
function closePreview(){
  preview.classList.remove('active');
  previewImg.src = "";
  document.body.style.overflow = "";
}
</script>

</body>
</html>
