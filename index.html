<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mint Water Photography</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(170, 255, 225, 0.5), transparent 30%),
      radial-gradient(circle at 80% 25%, rgba(110, 215, 205, 0.3), transparent 32%),
      linear-gradient(165deg, #e6f7f2 0%, #d4f0eb 50%, #c5e9e4 100%);
  }

  .ios-card {
    width: 100%;
    max-width: 420px;
    padding: 52px 32px 40px;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.68);
    border-radius: 32px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.92) inset,
      0 -1px 0 rgba(255, 255, 255, 0.45) inset,
      0 20px 50px rgba(70, 140, 125, 0.16),
      0 8px 20px rgba(90, 160, 145, 0.10);
    backdrop-filter: saturate(200%) blur(30px);
    -webkit-backdrop-filter: saturate(200%) blur(30px);
  }

  .ios-title-wrap {
    margin-bottom: 48px;
  }

  .ios-main-title {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1.08;
    color: #48a392;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8), 0 3px 12px rgba(90,190,165,0.3);
  }

  .ios-sub-title {
    font-size: 17px;
    font-weight: 400;
    color: #3a3a3c;
    margin-top: 10px;
    line-height: 1.47;
    letter-spacing: -0.01em;
  }

  .ios-btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ios-glass-btn {
    min-width: 145px;
    padding: 13px 24px;
    border-radius: 980px;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-decoration: none;
    color: #0f2b24;
    background: linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.48) 100%);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.95) inset,
      0 -1px 0 rgba(255,255,255,0.4) inset,
      0 12px 28px rgba(75,150,135,0.15),
      0 5px 12px rgba(95,170,155,0.1);
    backdrop-filter: saturate(180%) blur(26px);
    -webkit-backdrop-filter: saturate(180%) blur(26px);
    transition: transform 0.22s cubic-bezier(0.25,0.1,0.25,1), box-shadow 0.22s ease, background 0.22s ease;
  }

  .ios-glass-btn:hover {
    transform: translateY(-1.5px);
    background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.6) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.98) inset,
      0 -1px 0 rgba(255,255,255,0.45) inset,
      0 16px 34px rgba(65,135,120,0.18),
      0 7px 16px rgba(85,160,145,0.12);
  }

  .ios-glass-btn:active {
    transform: translateY(0) scale(0.975);
    background: linear-gradient(180deg, rgba(255,255,255,0.68) 0%, rgba(255,255,255,0.4) 100%);
  }

  @media (max-width: 480px) {
    body {
      padding: 16px;
    }
    .ios-card {
      padding: 44px 24px 36px;
      border-radius: 28px;
    }
    .ios-main-title {
      font-size: 33px;
    }
    .ios-glass-btn {
      min-width: 130px;
      padding: 12px 20px;
      font-size: 15px;
    }
  }
</style>
</head>

<body>
  <div class="ios-card">
    <div class="ios-title-wrap">
      <h1 class="ios-main-title">Mint Water Photography</h1>
      <p class="ios-sub-title">删了吧，没意义的歌</p>
    </div>
    <div class="ios-btn-group">
      <a class="ios-glass-btn" href="https://tizzy-090131.github.io/Photo-tutorial/gallery.html">摄影技巧</a>
      <a class="ios-glass-btn" href="https://tizzy-090131.github.io/Photo-tutorial/pose.html">拍照姿势</a>
    </div>
  </div>
</body>
</html>
